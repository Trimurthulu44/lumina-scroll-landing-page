    <!-- Anti-FOUC Theme Initialization Script -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('lumina_theme');
          var supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && supportDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-lumina-50 text-slate-900 dark:bg-dark-bg dark:text-slate-100 antialiased selection:bg-lumina-500 selection:text-white transition-colors duration-300 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
